[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contourmark"
version = "0.1.0"
description = "Keyed, reference-assisted geometric watermarking for SVG contours"
requires-python = ">=3.10"
dependencies = ["svgpathtools>=1.6,<2", "scipy>=1.10,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "scour>=0.38"]
eval = ["Pillow>=10,<13"]

[project.scripts]
contourmark = "contourmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
